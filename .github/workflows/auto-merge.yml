name: Auto-merge Maintainer PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for rizalazky
    if: >-
      github.event.pull_request.user.login == 'rizalazky' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -Eeuo pipefail

          auto_merge_request="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest')"

          if [ "$auto_merge_request" != "null" ] && [ -n "$auto_merge_request" ]; then
            echo "Auto-merge is already enabled for this pull request."
            exit 0
          fi

          gh pr merge "$PR_URL" --auto --squash
